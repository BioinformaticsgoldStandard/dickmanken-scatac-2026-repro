version: '3.8'

services:
  scatac-repro:
    build: .
    container_name: scatac-repro
    privileged: true
    user: root
    ports:
      - "8888:8888"
    volumes:
      - .:/home/jovyan/work
      - docker-cache:/var/lib/docker
    environment:
      - DOCKER_HOST=unix:///var/run/docker.sock
      - NB_USER=jovyan
      - NB_UID=1000
      - NB_GID=100
    working_dir: /home/jovyan/work
    stdin_open: true
    tty: true

volumes:
  docker-cache:
